onboarding = false

[theme]
name = "catppuccin"
auto_switch = false

[keys]
new_tab = "prefix+t"
rename_tab = "prefix+,"
split_vertical = "prefix+|"
navigate_workspace_up = "k"
navigate_workspace_down = "j"
navigate_pane_up = "up"
navigate_pane_down = "down"

[[keys.command]]
key = "prefix+i"
type = "shell"
description = "init workspace tabs"
command = "~/.config/herdr/init.sh"

[[keys.command]]
key = "prefix+alt+g"
type = "popup"
command = "lazygit"
description = "run lazygit"
width = "80%"
height = "80%"
