set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-pain-control'
set -g @plugin 'tmux-plugins/tmux-urlview'

set -as terminal-features 'xterm-ghostty:extkeys'

# Bindings
bind r source-file ~/.tmux.conf
bind t new-window

# Options
set-option -g status-position top
set-option -g allow-rename off
set-option -g focus-events on # required by nvim

setw -g mouse on
setw -g base-index 1
setw -g pane-base-index 1
setw -g window-status-format ' #I:#W '

set -sg escape-time 1 # quicker responses
set -s extended-keys on


# Status bar (Catppuccin Macchiato)
set -g status-style "bg=#24273a,fg=#6e738d"

set -g status-left ""
set -g status-left-length 0

set -g status-right " #S "
set -g status-right-style "fg=#5b6078"

set -g window-status-format '#I:#W'
set -g window-status-separator '#[fg=#494d64] • '

set -g window-status-current-style "fg=#8aadf4"
set -g window-status-current-format '#I#[fg=#6e738d]:#[fg=#8bd5ca]#W'

# Initialize TMUX plugin manager (keep this line at the very bottom)
run '~/.tmux/plugins/tpm/tpm'
